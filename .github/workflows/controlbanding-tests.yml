name: Control Banding – pruebas de fases 1 a 4
on:
  push:
    branches: [main, feat/fases-3-4-evidencia-accesibilidad]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis de módulos
        run: |
          node --check methodology.js
          node --check auth-gate.js
          node --check evaluation-evidence.js
          node --check report-pdf.js
          node --check accessibility.js
      - name: Regresiones de metodología
        run: node tests/methodology.test.cjs
      - name: Evidencia y autenticidad de la importación
        run: node tests/evidence.test.cjs
      - name: Informe multipágina y trazabilidad
        run: node tests/report.test.cjs
      - name: Inicio de sesión y orden real de carga de scripts
        run: node tests/auth-boot.test.cjs
      - name: Integración y sintaxis HTML
        run: node tests/integration.test.cjs
